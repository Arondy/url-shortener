services:
  url-shortener:
    image: us/url-shortener:latest
    build:
      context: .
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      - HTTP_SERVER_HOST=0.0.0.0
      - DB_HOST=postgres
    env_file:
      - .env
    ports:
      - "8080:${HTTP_SERVER_PORT:?}"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      start_period: 5s
      interval: 30s
      timeout: 10s
      retries: 5

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${DB_USER:?}:${DB_PASSWORD:?}@postgres:5432/${DB_NAME:?}?sslmode=${DB_SSL_MODE:-disable}
    command: [ "up" ]

volumes:
  postgres-data:
